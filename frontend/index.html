<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>RAPALLE.net RMM</title>

  <!-- Socket.IO Client-Bibliothek von einem CDN (kein npm/Build nötig) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <!-- guacamole-common-js wird NICHT mehr hier vorab geladen: Das npm-Paket
       1.5.0 enthält kein klassisches <script>-Bundle (nur dist/esm + dist/cjs,
       beide als <script src> untauglich -> 404 bzw. "module is not defined").
       Die Guacamole-App (js/apps/guacamole.js) lädt die Bibliothek bei Bedarf
       selbst: zuerst lokal aus /js/vendor/, dann per import()/Shim vom CDN. -->


  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <link rel="icon" href="images/logo_r.png"/>
</head>
<body>

  <!-- ============================================================ -->
  <!-- LOGIN-BILDSCHIRM (wird per JS ein-/ausgeblendet)               -->
  <!-- ============================================================ -->
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h1 class="login-logo">RAPALLE<span>.net</span> RMM</h1>
      <p class="login-subtitle">Anmelden</p>

      <form id="login-form">
        <label>Anmeldung über</label>
        <select id="login-realm">
          <option value="local">Lokal</option>
        </select>

        <label>Benutzername</label>
        <input type="text" id="login-username" autocomplete="username" required />

        <label>Passwort</label>
        <input type="password" id="login-password" autocomplete="current-password" required />

        <!-- Zwei-Faktor: wird erst eingeblendet, wenn das Backend danach fragt.
             So sehen Benutzer ohne 2FA das Feld nie. -->
        <div id="login-2fa-row" class="hidden">
          <label for="login-code">Einmalcode aus der Authenticator-App</label>
          <input type="text" id="login-code" inputmode="numeric" autocomplete="one-time-code"
                 pattern="[0-9a-z\- ]*" maxlength="12" placeholder="123456" />
          <div style="font-size:11px;opacity:.7;margin-top:4px">
            Kein Zugriff auf die App? Einen Wiederherstellungscode eingeben.
          </div>
        </div>
        <div id="login-error" class="form-error hidden"></div>

        <button type="submit" class="btn-primary">Anmelden</button>
      </form>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- PFLICHT-PASSWORTWECHSEL (nach erstem Login mit Einmalpasswort)  -->
  <!-- ============================================================ -->
  <div id="change-pw-screen" class="login-screen hidden">
    <div class="login-box">
      <h1 class="login-logo">RAPALLE<span>.net</span> RMM</h1>
      <p class="login-subtitle">Bitte neues Passwort setzen</p>

      <form id="change-pw-form">
        <label>Aktuelles (Einmal-)Passwort</label>
        <input type="password" id="cpw-current" required />

        <label>Neues Passwort (min. 8 Zeichen)</label>
        <input type="password" id="cpw-new" required minlength="8" />

        <label>Neues Passwort wiederholen</label>
        <input type="password" id="cpw-repeat" required minlength="8" />

        <div id="cpw-error" class="form-error hidden"></div>

        <button type="submit" class="btn-primary">Passwort setzen</button>
      </form>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- HAUPT-APP (Dashboard) - erst sichtbar nach erfolgreichem Login  -->
  <!-- ============================================================ -->
  <div id="app" class="app hidden">

    <!-- Kopfleiste -->
    <header class="topbar">
      <div class="topbar-left">
        <button id="mobile-sidebar-btn" class="mobile-sidebar-btn" title="Geräte" aria-label="Geräte-Liste öffnen">☰</button>
        <img src="/images/logo_r.png" alt="Logo" class="topbar-logo" onerror="this.style.display='none'" />
        <span class="topbar-title">RAPALLE<span class="accent">.net</span> RMM</span>
        <span class="topbar-version"><!-- wird aus /api/version (version.txt) befüllt --></span>
      </div>
      <div class="topbar-right">
        <button id="user-menu-btn" class="user-menu-btn">
          <span id="user-menu-name">...</span> ▾
        </button>
        <div id="user-menu" class="user-menu hidden">
          <button id="btn-open-profile">Profil / Passwort ändern</button>
          <button id="btn-open-notifications">Benachrichtigungen</button>
          <button id="btn-open-settings">Einstellungen</button>
          <hr />
          <button id="btn-logout">Abmelden</button>
        </div>
      </div>
    </header>

    <!-- Hauptbereich: Sidebar links + Content rechts -->
    <div class="main-area">

      <!-- Backdrop hinter dem Mobile-Drawer (nur auf kleinen Screens sichtbar) -->
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <!-- Einklappbare Seitenleiste mit der Tenant/Location/Client-Hierarchie -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span>Geräte</span>
          <div>
            <button id="btn-manage-hierarchy" title="Tenants/Standorte verwalten">⚙️</button>
            <button id="sidebar-collapse-btn" title="Einklappen">«</button>
          </div>
        </div>
        
        <!-- Dashboard-Eintrag (Platzhalter für die Zukunft) -->
        <div id="sidebar-dashboard" class="sidebar-nav-item" data-nav="dashboard">
          <span class="nav-ico">📊</span> Dashboard
          <!-- <span class="nav-soon">bald</span>-->
        </div>

        <!-- Ausklappbare Favoriten (Tenants + Clients mit Stern) -->
        <div class="sidebar-fav">
          <div id="fav-header" class="sidebar-fav-header">
            <span class="fav-caret">▾</span> <span class="nav-ico">★</span>
            <span class="fav-title">Favoriten</span>
            <!-- Eigenen Favoriten anlegen (App, App-Unterseite, Client-Sitzung, Link) -->
            <button id="fav-add-btn" class="fav-add-btn" type="button"
                    title="Favorit anheften (App, Unterseite, Client-Sitzung, Link)"
                    aria-label="Favorit anheften">★</button>
          </div>
          <div id="sidebar-fav-list" class="sidebar-fav-list">
            <!-- wird per JS befüllt (sidebar.js) -->
          </div>
        </div>

        <div class="sidebar-section-label">Alle Geräte</div>
        <div id="sidebar-tree" class="sidebar-tree">
          <!-- wird per JS befüllt (sidebar.js) -->
        </div>
        <button id="btn-add-client" class="btn-add-client">+ Client hinzufügen</button>
      </aside>
      <div id="sidebar-resizer" class="sidebar-resizer" title="Breite ziehen"></div>

      <!-- Hauptinhalt: Status/Metrics/Actions für den ausgewählten Client,
           oder eine aggregierte Übersicht für Tenant/Location -->
      <main id="main-content" class="main-content">
        <div class="empty-state">
          Wähle links einen Tenant, Standort oder Client aus.
        </div>
      </main>
    </div>

    <!-- Bereich, in dem alle offenen Fenster (Terminal, Explorer, ...) liegen -->
    <div id="window-layer" class="window-layer"></div>

    <!-- Taskleiste -->
    <footer class="taskbar">
      <button id="taskbar-menu-btn" class="taskbar-btn taskbar-menu-btn" title="Menü">☰</button>
      <button id="taskbar-minimize-all-btn" class="taskbar-btn" title="Alle minimieren">▁</button>
      <div id="taskbar-windows" class="taskbar-windows"></div>
      <!-- Sauberer Neustart der Oberfläche: lädt neu, OHNE die offenen
           Fenster/Apps und den ausgewählten Client wiederherzustellen. -->
      <button id="taskbar-reload-btn" class="taskbar-btn" title="Oberfläche neu laden (ohne offene Fenster wiederherzustellen)">⟳</button>
      <div id="taskbar-clock" class="taskbar-clock"></div>
    </footer>

    <!-- Großes DSM-artiges App-Menü (zentriertes Overlay mit Kacheln) -->
    <div id="start-menu" class="start-menu-overlay hidden">
      <div class="start-menu-panel">
        <div class="start-menu-header">Anwendungen</div>
        <div class="start-menu-grid">
          <button data-app="clients"><span class="app-icon">📊</span><span>Geräte-Übersicht</span></button>
          <button data-app="manage"><span class="app-icon">🏢</span><span>Tenants &amp; Standorte</span></button>
          <button data-app="scripts"><span class="app-icon">📜</span><span>Scripts</span></button>
          <button data-app="bulk"><span class="app-icon">⚡</span><span>Bulk Remote Shell</span></button>
          <button data-app="automation"><span class="app-icon">🔁</span><span>Automation</span></button>
          <button data-app="relay-manager"><span class="app-icon">🔌</span><span>Explorer-Relay</span></button>
          <button data-app="relay-explorer"><span class="app-icon">📦</span><span>Relay-Explorer</span></button>
          <button data-app="vpn"><span class="app-icon">🔐</span><span>VPN</span></button>
          <button data-app="network"><span class="app-icon">📡</span><span>Netzwerk-Scanner</span></button>
          <button data-app="speedtest"><span class="app-icon">🚀</span><span>Speedtest</span></button>
          <button data-app="portscan"><span class="app-icon">🎯</span><span>Portscan</span></button>
          <button data-app="recordings"><span class="app-icon">🎥</span><span>Aufzeichnungen</span></button>
          <button data-app="gaminghub"><span class="app-icon">🎮</span><span>Gaming Hub</span></button>
          <button data-app="aichat"><span class="app-icon">🤖</span><span>AI Chat</span></button>
          <button data-app="audioplayer"><span class="app-icon">🎵</span><span>Audio Player</span></button>
          <button data-app="webbrowser"><span class="app-icon">🌐</span><span>Browser</span></button>
          <button data-app="tickets"><span class="app-icon">🎫</span><span>Tickets</span></button>
          <button data-app="chat"><span class="app-icon">💬</span><span>Chat</span></button>
          <button data-app="calendar"><span class="app-icon">🗓️</span><span>Kalender</span></button>
          <button data-app="todos"><span class="app-icon">✅</span><span>Todos</span></button>
          <button data-app="orgchart"><span class="app-icon">🏛️</span><span>Organigramm</span></button>
          <button data-app="audit"><span class="app-icon">📝</span><span>Audit-Log</span></button>
          <button data-app="settings"><span class="app-icon">⚙️</span><span>Einstellungen</span></button>
          <button data-app="permissions"><span class="app-icon">🔐</span><span>Berechtigungen</span></button>
          <button data-app="patching"><span class="app-icon">🔄</span><span>Updates</span></button>
          <button data-app="privacy"><span class="app-icon">🛡️</span><span>Datenschutz</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Eigener Code, als ES-Modul geladen (erlaubt "import" zwischen Dateien) -->
  <script type="module" src="/js/icons.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/mobile.js"></script>
</body>
</html>
