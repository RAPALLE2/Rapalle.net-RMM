# ─────────────────────────────────────────────────────────────────────────────
# RAPALLE.net RMM - docker compose
#
# Start:      docker compose up -d --build
# Logs:       docker compose logs -f rmm
# Stop:       docker compose down
# Update:     git pull  (oder neues Release entpacken)  &&  docker compose up -d --build
#
# WICHTIG - was im Container NICHT mehr zur Laufzeit änderbar ist:
#   * PORT und HOST. Beides wird beim Container-Start festgelegt (Port-Mapping
#     unten + Umgebungsvariablen). Wer PORT/HOST in backend/.env ändert, sperrt
#     sich aus: der Container mappt weiterhin den alten Port.
#     -> Port ändern heißt: RMM_PORT unten (bzw. in .env) ändern und
#        "docker compose up -d" erneut ausführen.
#   * Alles, was nicht in einem Volume liegt, ist nach einem Rebuild weg.
#     Deshalb sind backend/ frontend/ agent/ als Bind-Mounts eingehängt.
# Die Oberfläche zeigt das unter Einstellungen -> Source ebenfalls an.
# ─────────────────────────────────────────────────────────────────────────────

services:
  rmm:
    build:
      context: .
      dockerfile: Dockerfile
    image: rapallenet/rmm:local
    container_name: rapalle-rmm

    # Der Container darf sich selbst neu starten (Settings -> Source ->
    # "Backend neu starten" und das Selbst-Update beenden den Prozess).
    restart: unless-stopped

    environment:
      # Installationsart - wird in der Oberfläche angezeigt. Nicht ändern.
      RMM_INSTALL_KIND: docker
      # Im Container immer 0.0.0.0, sonst ist das Dashboard von außen nicht
      # erreichbar. NICHT auf eine LAN-IP setzen.
      HOST: 0.0.0.0
      # Interner Port. Muss zum Port-Mapping unten passen.
      PORT: "${RMM_PORT:-4000}"
      TZ: "${TZ:-Europe/Berlin}"
      # Startet der Container nicht, zeigt "docker compose logs -f rmm" seit
      # dem Start-Skript einen Umgebungsbericht und den genauen Grund.
      # Zum Nachsehen IM Container: hier auf "1" setzen - dann bleibt er nach
      # einem Fehler offen und "docker compose exec rmm sh" funktioniert.
      RMM_KEEP_ALIVE: "${RMM_KEEP_ALIVE:-0}"
      # Guacamole-Proxy (RDP/VNC/SSH im Browser). Zeigt auf den guacd-Dienst
      # unten; ist der auskommentiert, bleibt das ohne Wirkung.
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      # Geheimnisse: unbedingt in einer .env neben dieser Datei setzen!
      # AGENT_TOKEN: "${AGENT_TOKEN}"
      # JWT_SECRET:  "${JWT_SECRET}"

    ports:
      # links = Port auf dem Host (im Browser), rechts = Port im Container.
      # Beide über RMM_PORT steuerbar; nach Änderung "docker compose up -d".
      - "${RMM_PORT:-4000}:${RMM_PORT:-4000}"
      # WireGuard-Endpunkt (UDP!). Der Tunnel wird in reinem Python im
      # Backend abgewickelt - es braucht weder das Kernel-Modul noch
      # NET_ADMIN. Ohne diese Freigabe erreicht kein VPN-Client den Server.
      - "${VPN_PORT:-51820}:${VPN_PORT:-51820}/udp"
      # Relay: Bringt Benutzer und Node zusammen, wenn beide hinter NAT
      # sitzen. Ohne diesen Port laeuft alles ueber die Agent-Verbindung -
      # das funktioniert auch, ist aber deutlich langsamer.
      - "${VPN_RELAY_PORT:-51821}:${VPN_RELAY_PORT:-51821}/udp"

    volumes:
      # Der komplette Projektcode liegt als Bind-Mount im Container.
      # Nur so funktionieren: Source-Editor (Dateien speichern),
      # Selbst-Update (Code austauschen), Datenbank/Aufzeichnungen dauerhaft.
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./agent:/app/agent
      # Zeitzone vom Host übernehmen (read-only).
      - /etc/localtime:/etc/localtime:ro
      # Docker-Socket: Damit kann das Backend Nachbar-Container selbst starten -
      # guacd (RDP/VNC/SSH) und die SQL-Datenbank lassen sich dann direkt im
      # Dashboard dazuschalten (Einstellungen -> Allgemein -> Container-Dienste).
      # Ohne diese Zeile bleiben genau diese Schalter wirkungslos.
      #
      # SICHERHEITSHINWEIS: Wer den Socket erreicht, kann auf dem HOST beliebige
      # Container starten - das entspricht faktisch Rootrechten auf dem Host.
      # Der Zugang zum RMM-Dashboard (und besonders das Recht 'see_source')
      # muss deshalb entsprechend streng vergeben werden. Wer das nicht will,
      # kommentiert die Zeile aus; die Container-Dienste sind dann deaktiviert
      # und guacd/SQL müssen von Hand betrieben werden.
      - /var/run/docker.sock:/var/run/docker.sock

    # Der Container laeuft standardmaessig als root IM Container - das ist
    # nicht dasselbe wie root auf dem Host und in aller Regel richtig so.
    # Soll er unter einer eigenen UID laufen (rootless Docker, strenge
    # Vorgaben), hier setzen und die Bind-Mounts entsprechend freigeben:
    #   user: "1000:1000"
    #   und auf dem Host:  chmod -R a+rX backend frontend agent
    #                      chmod -R u+rwX,a+rwX backend/recordings backend/media_files
    # Wichtig bei UNPRIVILEGIERTEM LXC (z.B. Proxmox): dort werden die UIDs der
    # Bind-Mounts verschoben (root wird zu 100000). Die Projektdateien muessen
    # dann fuer "andere" les- UND betretbar sein (a+rX), sonst findet Python
    # das Paket "app" nicht und meldet ModuleNotFoundError.

    # ── Leistung: CPU und Arbeitsspeicher ──────────────────────────────────
    # WICHTIG zum Verständnis: Diese Werte VERTEILEN keine Leistung, sie
    # BEGRENZEN sie. Ohne Angabe darf der Container ohnehin alles nutzen.
    # Läuft es zäh, liegt es also fast nie an fehlenden Limits, sondern an
    # bereits gesetzten - etwa im Synology Container Manager, der beim Anlegen
    # gern enge Grenzen einträgt. Dort unter "Ressourcenbegrenzung" nachsehen.
    #
    # Die Werte hier sind deshalb bewusst großzügig und über die .env
    # anpassbar. Wer gar nicht begrenzen will, kommentiert den Block aus.
    cpus: "${RMM_CPUS:-4}"
    mem_limit: "${RMM_MEMORY:-4g}"
    mem_reservation: "${RMM_MEMORY_MIN:-512m}"   # so viel wird reserviert
    # Gemeinsamer Speicher: Der Standard von 64 MB ist für Bildschirm-
    # aufzeichnungen und größere Übertragungen schnell zu knapp.
    shm_size: "${RMM_SHM:-512m}"
    # Nicht in den Auslagerungsspeicher drängen - das ist der häufigste Grund
    # für plötzliche Hänger bei laufenden Fernsitzungen.
    memswap_limit: "${RMM_MEMORY:-4g}"

    # Netzwerk-Scanner und Ping brauchen rohe Sockets, WireGuard braucht
    # zusaetzlich das Anlegen von Schnittstellen und Routen (NET_ADMIN).
    cap_add:
      - NET_RAW
      - NET_ADMIN

    # TUN-Geraet fuer wireguard-go. Ohne diese Zeile faellt das VPN auf die
    # eigene Python-Umsetzung zurueck (weniger erprobt).
    #
    # Fehlt /dev/net/tun auf dem Wirt, einmalig laden:
    #     sudo modprobe tun
    # Dauerhaft (Debian/Ubuntu):  echo tun >> /etc/modules
    # Auf Synology/QNAP ist das Modul vorhanden, aber nach einem Neustart
    # oft nicht geladen - dann in den Aufgabenplaner eintragen.
    devices:
      - /dev/net/tun:/dev/net/tun

    depends_on:
      - guacd

    # HINWEIS Synology Container Manager: Wird hier ein eigener logging-Treiber
    # gesetzt, zeigt die Weboberflaeche im Reiter "Protokoll" haeufig gar nichts
    # mehr an ("Keine Protokolle verfuegbar"). Deshalb bleibt der Standard
    # aktiv. Wer die Rotation braucht, kann den Block wieder einkommentieren -
    # dann aber die Logs ueber "docker compose logs -f rmm" lesen.
    #
    # Unabhaengig davon schreibt der Container seinen Start immer zusaetzlich
    # nach  backend/startup.log  - diese Datei ist ueber die Dateifreigabe
    # bzw. Settings -> Source lesbar, auch wenn die Oberflaeche nichts zeigt.
    # logging:
    #   driver: json-file
    #   options:
    #     max-size: "20m"
    #     max-file: "5"

  # ───────────────────────────────────────────────────────────────────────────
  # Apache guacd - Proxy für RDP / VNC / SSH im Browser.
  # Wird nur gebraucht, wenn Remote-Sitzungen im Browser genutzt werden.
  # Nicht benötigt? Diesen Block und "depends_on" oben auskommentieren.
  #
  # Alternative: den Docker-Socket oben einhängen und guacd im Dashboard unter
  # Einstellungen -> Allgemein -> Container-Dienste dazuschalten. Dann legt das
  # Backend den Container selbst an - hier ist dann nichts einzutragen.
  # ───────────────────────────────────────────────────────────────────────────
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: rapalle-rmm-guacd
    restart: unless-stopped
    # guacd macht die eigentliche Bildarbeit bei RDP/VNC - ruckelt eine
    # Fernsitzung, ist meist hier zu wenig Luft, nicht im Backend.
    cpus: "${GUACD_CPUS:-2}"
    mem_limit: "${GUACD_MEMORY:-1g}"
    shm_size: "256m"
    # Kein Port nach außen: nur der RMM-Container spricht mit guacd.
    expose:
      - "4822"
    volumes:
      # Aufzeichnungen der Sitzungen landen im gleichen Ordner wie beim
      # nativen Betrieb, damit sie im Dashboard auftauchen.
      - ./backend/recordings:/recordings
